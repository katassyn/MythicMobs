# =========================
#  MOBS (no-conditions timers)
# =========================

blood_sludge:
  Type: SLIME
  Display: '&4&lBlood Sludge &r &r&r&7[&c<caster.hp{round=1}>&7/&c<caster.mhp>&7] &4<&heart>'
  Health: 30000
  Damage: 18
  Options:
    Size: 6
    FollowRange: 22
    ShowHealth: true
    AlwaysShowName: true
    PreventItemPickup: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
    PreventJockeyMounts: true
    PreventTransformation: true
    Despawn: CHUNK
    MovementSpeed: 0.06
  Faction: Bloodborne
  Group: Bloodborne
  Skills:
    - skill{s=BleedMaxHP2p} @target ~onAttack
    - skill{s=BloodSpit} ~onTimer:100
    - setname{name='<caster.name>';delay=2} @self ~onDamaged
    - setname{name='<caster.name>';delay=2} @self ~onTimer:10
  Drops:
    - normal_mobs_drops

