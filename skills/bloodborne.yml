# =========================
#  SKILLE WSPÓLNE (projectile always casts)
# =========================

BleedMaxHP2p: # Krwawienie: 5% max HP celu co 1s przez 5s
  Skills:
    - repeat{times=5;interval=20}:
        - math{a="<target.mhp>*0.05";r=skill.bleed} @self
        - damage{amount="<skill.var.bleed>";ia=true} @target
        - effect:particles{p=redstone;amount=10;speed=0.1;hS=0.2;vS=0.2} @target
        - sound{s=entity.player.hurt;v=0.6;p=0.8} @target

BleedMaxHP1p: # Delikatniejsze krwawienie: 1% max HP celu co 1s przez 5s
  Skills:
    - repeat{times=5;interval=20}:
        - math{a="<target.mhp>*0.01";r=skill.bleed} @self
        - damage{amount="<skill.var.bleed>";ia=true} @target
        - effect:particles{p=redstone;amount=6;speed=0.05;hS=0.2;vS=0.2} @target

# Pocisk: najpierw w najbliższego gracza (r=22, z LOS), jeśli nie może -> strzał do przodu.
BloodSpit:
  Skills:
    - projectile{v=18;hR=1;vR=1;hnp=true;onHit=BloodSpit_Hit;onTick=BloodSpit_Tick}
      @NearestPlayer{r=22} ?lineofsight
    - projectile{v=18;hR=1;vR=1;hnp=true;onHit=BloodSpit_Hit;onTick=BloodSpit_Tick}
      @Forward{f=28} ?!playersinradius{r=22}

BloodSpit_Hit:
  Skills:
    - damage{amount=450}
    - potion{type=SLOW;duration=160;level=7}
    - effect:particles{p=block_crack;m=redstone_block;amount=24;speed=0.2;hS=0.3;vS=0.3}
    - sound{s=entity.slime.attack;v=1.0;p=0.6}

BloodSpit_Tick:
  Skills:
    - effect:particles{p=redstone;amount=2;speed=0.01;hS=0.05;vS=0.05} @origin
